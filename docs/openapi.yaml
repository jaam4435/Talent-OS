openapi: 3.1.0
info:
  title: Talent OS API
  version: 1.0.0
  description: |
    Talent OS HTTP API. All authenticated endpoints use session cookies.
    Standard response envelope: `{ data, meta? }` on success, `{ error: { code, message, details? } }` on failure.
    API version header: `X-API-Version: v1` (default).
servers:
  - url: /api
    description: Relative to deployment origin
tags:
  - name: System
  - name: Auth
  - name: Talent
  - name: Projects
  - name: Assignments
  - name: Workflows
  - name: WhatsApp
  - name: AI
  - name: Analytics
  - name: Team
  - name: Organization
  - name: CRM
  - name: Webhooks
  - name: Cron
  - name: Internal
  - name: Observability
components:
  headers:
    X-API-Version:
      schema:
        type: string
        example: v1
    X-Request-ID:
      schema:
        type: string
        format: uuid
    Idempotency-Key:
      schema:
        type: string
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - NO_TENANT
                - FORBIDDEN
                - NOT_FOUND
                - VALIDATION_ERROR
                - DUPLICATE
                - RATE_LIMITED
                - IDEMPOTENCY_CONFLICT
                - INTERNAL_ERROR
                - AI_MATCHING_DISABLED
                - AI_MONTHLY_LIMIT_EXCEEDED
                - WEBHOOK_INVALID_SIGNATURE
                - CRON_UNAUTHORIZED
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-access-token
    cronBearer:
      type: http
      scheme: bearer
paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service health (legacy envelope)
  /auth/session:
    get:
      tags: [Auth]
      summary: Get current session
      operationId: getSession
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Session context or null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/invite/{token}:
    get:
      tags: [Auth]
      summary: Preview team invite
      operationId: getInvitePreview
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite preview
        '404':
          description: Invite not found
  /talent/search:
    get:
      tags: [Talent]
      summary: Search talent roster
      operationId: searchTalent
      security: [{ sessionCookie: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: discipline
          in: query
          schema: { type: string }
        - name: availability
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated talent results
        '403':
          description: Managers only
  /talent:
    get:
      tags: [Talent]
      summary: Advanced talent list/search
      operationId: listTalent
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Paginated talent profiles
    post:
      tags: [Talent]
      summary: Create talent profile
      operationId: createTalent
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Created profile
  /talent/{id}:
    get:
      tags: [Talent]
      summary: Get talent profile
      operationId: getTalent
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Talent profile
    patch:
      tags: [Talent]
      summary: Update talent profile
      operationId: updateTalent
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated profile
    delete:
      tags: [Talent]
      summary: Soft delete talent profile
      operationId: deleteTalent
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted
  /talent/{id}/experience:
    get:
      tags: [Talent]
      summary: List work experience
      operationId: listTalentExperience
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Experience entries
    post:
      tags: [Talent]
      summary: Add work experience
      operationId: addTalentExperience
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Created experience
  /talent/{id}/documents:
    get:
      tags: [Talent]
      summary: List talent documents
      operationId: listTalentDocuments
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Document list
    post:
      tags: [Talent]
      summary: Add talent document
      operationId: addTalentDocument
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Created document
  /talent/{id}/availability:
    get:
      tags: [Talent]
      summary: Availability calendar slots
      operationId: listTalentAvailability
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Calendar slots
    post:
      tags: [Talent]
      summary: Add availability slot
      operationId: addTalentAvailability
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Created slot
  /talent/{id}/completeness:
    get:
      tags: [Talent]
      summary: Profile completeness score
      operationId: getTalentCompleteness
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Completeness breakdown
  /talent/{id}/ai-profile:
    get:
      tags: [Talent]
      summary: AI-ready profile export
      operationId: getTalentAiProfile
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: AI profile payload
  /talent/match:
    post:
      tags: [Talent]
      summary: Skill-based talent matching
      operationId: matchTalentSkills
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Ranked matches
  /talent/import:
    post:
      tags: [Talent]
      summary: Bulk CSV import
      operationId: importTalentCsv
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Import batch result
  /talent/audit-logs:
    get:
      tags: [Talent]
      summary: List talent audit logs
      operationId: listTalentAuditLogs
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Paginated audit entries
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Paginated projects
    post:
      tags: [Projects]
      summary: Create project
      operationId: createProject
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Created project
  /projects/{id}:
    get:
      tags: [Projects]
      summary: Get project
      operationId: getProject
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Project detail
    patch:
      tags: [Projects]
      summary: Update project
      operationId: updateProject
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated project
  /projects/{id}/status:
    patch:
      tags: [Projects]
      summary: Transition project status
      operationId: transitionProjectStatus
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated status
  /projects/{id}/health:
    get:
      tags: [Projects]
      summary: Project health score
      operationId: getProjectHealth
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
