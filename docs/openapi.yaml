  /assignments/conflicts/check:
    post:
      tags: [Assignments]
      summary: Check assignment conflicts
      operationId: checkAssignmentConflicts
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Conflict check results
  /assignments/suggest:
    post:
      tags: [Assignments]
      summary: Suggest assignment candidates
      operationId: suggestAssignmentCandidates
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Ranked candidates
  /assignments/capacity:
    get:
      tags: [Assignments]
      summary: Get freelancer capacity
      operationId: getAssignmentCapacity
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Capacity records
    post:
      tags: [Assignments]
      summary: Set freelancer capacity
      operationId: setAssignmentCapacity
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Capacity record
  /assignments/audit-logs:
    get:
      tags: [Assignments]
      summary: List assignment audit logs
      operationId: listAssignmentAuditLogs
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Paginated audit entries
  /workflows/definitions:
    get:
      tags: [Workflows]
      summary: List workflow definitions
      operationId: listWorkflowDefinitions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Registry or stored definitions
    post:
      tags: [Workflows]
      summary: Create custom workflow definition
      operationId: createWorkflowDefinition
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Created definition
  /workflows/runs:
    get:
      tags: [Workflows]
      summary: List workflow runs
      operationId: listWorkflowRuns
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Paginated runs
  /workflows/jobs:
    get:
      tags: [Workflows]
      summary: List workflow jobs
      operationId: listWorkflowJobs
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Paginated jobs
  /workflows/history:
    get:
      tags: [Workflows]
      summary: List workflow execution history
      operationId: listWorkflowHistory
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Step-level history
  /workflows/compensations:
    get:
      tags: [Workflows]
      summary: List workflow compensations
      operationId: listWorkflowCompensations
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Compensation queue
  /workflows/trigger:
    post:
      tags: [Workflows]
      summary: Manually trigger a workflow
      operationId: triggerWorkflow
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Trigger result with run IDs
  /workflows/observability:
    get:
      tags: [Workflows]
      summary: Workflow engine observability summary
      operationId: getWorkflowObservability
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Metrics and business workflow catalog
  /workflows/audit-logs:
    get:
      tags: [Workflows]
      summary: List workflow audit logs
      operationId: listWorkflowAuditLogs
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Paginated audit entries
  /whatsapp/conversations:
    get:
      tags: [WhatsApp]
      summary: List WhatsApp conversations
      operationId: listWhatsAppConversations
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Paginated conversation summaries
  /whatsapp/conversations/{freelancerId}:
    get:
      tags: [WhatsApp]
      summary: Get conversation and memory for a freelancer
      operationId: getWhatsAppConversation
      security: [{ sessionCookie: [] }]
      parameters:
        - name: freelancerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversation context and memory entries
  /whatsapp/audit-logs:
    get:
      tags: [WhatsApp]
      summary: List WhatsApp platform audit logs
      operationId: listWhatsAppAuditLogs
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Paginated audit entries
  /whatsapp/observability:
    get:
      tags: [WhatsApp]
      summary: WhatsApp platform observability summary
      operationId: getWhatsAppObservability
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Module metrics
  /whatsapp/approvals:
    get:
      tags: [WhatsApp]
      summary: List pending WhatsApp and workflow approvals
      operationId: listWhatsAppApprovals
      security: [{ sessionCookie: [] }]
