  /projects/templates:
    get:
      tags: [Projects]
      summary: List project templates
      operationId: listProjectTemplates
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Template list
    post:
      tags: [Projects]
      summary: Create project template
      operationId: createProjectTemplate
