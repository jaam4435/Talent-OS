  /projects/{id}/tasks:
    get:
      tags: [Projects]
      summary: List project tasks
      operationId: listProjectTasks
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Task list
    post:
      tags: [Projects]
      summary: Create project task
      operationId: createProjectTask
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
