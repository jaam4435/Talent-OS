  /observability/logs:
    get:
      tags: [Observability]
      summary: Query structured platform logs
      operationId: queryObservabilityLogs
      security: [{ sessionCookie: [] }]
      parameters:
        - name: level
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200':
          description: Log entries
  /observability/traces/{correlationId}:
    get:
      tags: [Observability]
      summary: Trace spans by correlation ID
      operationId: getObservabilityTrace
      security: [{ sessionCookie: [] }]
      parameters:
        - name: correlationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Trace spans
  /cron/evaluate-alerts:
    get:
      tags: [Cron]
      summary: Evaluate platform alert rules
      operationId: cronEvaluateAlerts
      security: [{ cronBearer: [] }]
      responses:
        '200':
          description: Alert evaluation results
  /auth/signout:
    post:
      tags: [Auth]
      summary: Sign out current session
      operationId: signOut
      responses:
        '200':
          description: Signed out
  /auth/callback:
    get:
      tags: [Auth]
      summary: OAuth / magic link callback
      operationId: authCallback
      responses:
        '302':
          description: Redirect after authentication
  /team/members:
    get:
      tags: [Team]
      summary: List team members (legacy — prefer /organization/members)
      operationId: getTeamMembers
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Team members
        '403':
          description: Admin only
  /organization:
    get:
      tags: [Organization]
      summary: Get organization profile
      operationId: getOrganization
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Organization summary
    patch:
      tags: [Organization]
      summary: Update organization
      operationId: updateOrganization
      security: [{ sessionCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                timezone: { type: string }
                currency: { type: string, minLength: 3, maxLength: 3 }
                subscription_reference: { type: string, nullable: true }
      responses:
        '200':
          description: Updated organization
  /organization/branding:
    get:
      tags: [Organization]
      summary: Get organization branding
      operationId: getOrganizationBranding
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Branding
    patch:
      tags: [Organization]
      summary: Update organization branding
      operationId: updateOrganizationBranding
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Updated branding
  /organization/settings:
    get:
      tags: [Organization]
      summary: Get timezone, currency, business hours
      operationId: getOrganizationSettings
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Organization settings
    patch:
      tags: [Organization]
      summary: Update business hours
      operationId: updateOrganizationBusinessHours
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Updated
  /organization/subscription:
    get:
      tags: [Organization]
      summary: Get subscription reference
      operationId: getOrganizationSubscription
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Subscription reference
  /organization/permissions:
    get:
      tags: [Organization]
      summary: Role permission map
      operationId: getOrganizationPermissions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Permissions by role
  /organization/departments:
    get:
      tags: [Organization]
      summary: List departments
      operationId: listOrganizationDepartments
      security: [{ sessionCookie: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
