        '200':
          description: Pending approval gates
  /whatsapp/approvals/{id}:
    post:
      tags: [WhatsApp]
      summary: Resolve a workflow approval via WhatsApp platform
      operationId: resolveWhatsAppApproval
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
