      summary: Get AI project manager results
      operationId: getAiPmResults
      security: [{ sessionCookie: [] }]
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [project, opportunity]
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: AI PM results
  /analytics/dashboard:
